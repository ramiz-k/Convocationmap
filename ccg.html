<style>
:root{--bg:#f4f1ea;--ink:#1f2937;--muted:#6b7280;--card:#fff;--line:#e7e2d8;--brand:#7c2d12;--accent:#d97706;--green:#16a34a;--blue:#2563eb;--red:#e11d48}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:#fff;flex-wrap:wrap}
header .ttl{flex:1;min-width:150px}
header h1{font-size:16px;margin:0;line-height:1.25}
header p{margin:0;font-size:12px;opacity:.85}
.seg{display:inline-flex;background:rgba(255,255,255,.2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--brand)}
#layout{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#eceae4;overflow:hidden}
#panel{background:var(--card);border-top:1px solid var(--line);max-height:50%;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
@media(min-width:900px){#layout{flex-direction:row-reverse}#panel{width:400px;max-height:none;border-top:0;border-right:1px solid var(--line)}}
#map2d,#map3d{position:absolute;inset:0}
#map3d{display:none}
#map3d canvas{display:block;width:100%;height:100%}
.lab3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
svg#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#svg:active{cursor:grabbing}
.lbl{font-weight:700;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:7px;stroke-linejoin:round;pointer-events:none}
.lbl.dark{fill:#1f2937;stroke:rgba(255,255,255,.85)}
.tag{font-weight:700;fill:#1f2937;paint-order:stroke;stroke:#fff;stroke-width:13px;stroke-linejoin:round;pointer-events:none}
.gate{cursor:pointer}
.zone{cursor:pointer}
.rbase{fill:none;stroke:#e11d48;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.rcase{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.rdash{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 32;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-35}}
.pulse{fill:rgba(37,99,235,.4);transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.6);opacity:0}}
.ctrls{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrls button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.ctrls button.wide{font-size:13px;width:auto;padding:0 12px}
.badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:5;max-width:70%}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:9;text-align:center}
.tag3d{font:700 12px/1.2 Inter,'Noto Sans Devanagari',system-ui,sans-serif;color:#1f2937;background:rgba(255,255,255,.92);padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;transform:translateY(-6px)}
.tag3d.g1{background:#16a34a;color:#fff}.tag3d.g2{background:#2563eb;color:#fff}
.tag3d.zp{background:#f59e0b;color:#fff;font-size:13px}.tag3d.zf{background:#ef4444;color:#fff}.tag3d.zs{background:#14b8a6;color:#fff}.tag3d.zc{background:#a855f7;color:#fff}
.tag3d.sm{font-size:10.5px;font-weight:600;opacity:.9}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.dest .ic{font-size:22px}
.dest b{display:block;font-size:14px}
.dest small{color:var(--muted);font-size:12px}
.dest.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.dest:disabled{opacity:.4;cursor:not-allowed}
.result{margin-top:14px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:#fffaf3}
.meta{font-weight:700;font-size:15px;margin-bottom:4px}
.note{font-size:12px;color:var(--muted)}
ol.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:14px;line-height:1.4}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps li:not(:last-child):after{content:"";position:absolute;left:11px;top:25px;bottom:1px;width:2px;background:var(--line)}
ol.steps li.last:before{background:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--red);color:#fff}.btn.sec{background:#eee9df;color:var(--ink)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px}
.hint{color:var(--muted);font-size:14px;margin-top:12px}
</style>

const N = {

const EDGES = [
  ['S1','V1'],['V1','V2'],['V2','V3'],['V2','PHW'],['PHW','PH'],['V1','C1'],['C1','C2'],['C2','C3'],['C3','RNE'],

  ['RW','F1b'],['F1b','F1'],['RW','W2'],['W2','W3'],['W3','W4'],['W4','RSW'],['RSW','RL'],['RL','B1'],['B1','RSE'],
  ['RSE','E1'],['E1','E2'],['E2','E3'],['E3','RNE'],['V3','F2c'],['F2c','F2b'],['F2b','F2a'],['F2a','F2'],
  ['RE','PIN'],['PIN','PD'],['RL','LIN'],['LIN','LD'],['V3','SL1'],['SL1','SLD'],
];
const ADJ = {};
EDGES.forEach(([a, b]) => { const d = Math.hypot(N[a][0] - N[b][0], N[a][1] - N[b][1]); (ADJ[a] ??= []).push([b, d]); (ADJ[b] ??= []).push([a, d]); });
function shortest(a, b) {
  const dist = { [a]: 0 }, prev = {}, done = new Set(), q = [[0, a]];
  while (q.length) {
    q.sort((x, y) => x[0] - y[0]);
    const [d, u] = q.shift();
    if (done.has(u)) continue; done.add(u); if (u === b) break;
    for (const [v, w] of ADJ[u] || []) if (dist[v] === undefined || d + w < dist[v]) { dist[v] = d + w; prev[v] = u; q.push([dist[v], v]); }
  }
  if (dist[b] === undefined) return null;
  const path = [b]; while (path[0] !== a) path.unshift(prev[path[0]]);
  return { nodes: path, len: dist[b] };

function computeRoute() {
  route = null;
  if (!state.from || !state.to || state.from === state.to) return;
  const r = shortest(nodeIdOfKey(state.from), nodeIdOfKey(state.to));
  if (!r) return;
  const steps = [];
  r.nodes.forEach((id, i) => {
    if (i === 0 && !Object.values(GATES).some(g => g.node === id)) return;
    if (SAY[id]) steps.push(SAY[id]);
  });
  steps.push(ARRIVE[state.to]);
  route = { nodes: r.nodes, pts: r.nodes.map(id => N[id]), len: r.len, steps };
}

const view = { k: 1, x: 0, y: 0, touched: false };
const setT = () => world.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
function fit2d(bbox, pad = 80) {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const b = bbox || [0, 0, W, H];
  const bw = b[2] - b[0] + pad * 2, bh = b[3] - b[1] + pad * 2;
  view.k = Math.min(r.width / bw, r.height / bh);
  view.x = r.width / 2 - ((b[0] + b[2]) / 2) * view.k;
  view.y = r.height / 2 - ((b[1] + b[3]) / 2) * view.k;
  setT();
}
function zoomAt(f, cx, cy) {
  const k2 = Math.max(.08, Math.min(view.k * f, 2.2));
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = k2; view.x = cx - wx * k2; view.y = cy - wy * k2; view.touched = true; setT();
}
(function pointers() {
  const ptrs = new Map(); let moved = 0, last = null;
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const old = ptrs.get(e.pointerId), r = svg.getBoundingClientRect();
    if (ptrs.size === 1) {
      const dx = e.clientX - old[0], dy = e.clientY - old[1];
      moved += Math.abs(dx) + Math.abs(dy); view.x += dx; view.y += dy; view.touched = true; setT();
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(old[0] - other[0], old[1] - other[1]);
      const d1 = Math.hypot(e.clientX - other[0], e.clientY - other[1]);
      moved += 10;
      if (d0 > 0) zoomAt(d1 / d0, (e.clientX + other[0]) / 2 - r.left, (e.clientY + other[1]) / 2 - r.top);
    }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  });
  const up = e => {
    const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId);
    if (wasOne && moved < 8 && e.type === 'pointerup') onMapTap(e);
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
})();

  const X = x => (x - W / 2) * S, Zc = y => (y - H / 2) * S;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.insertBefore(renderer.domElement, host.firstChild);
  const lr = new CSS2DRenderer(); lr.domElement.className = 'lab3d'; host.insertBefore(lr.domElement, host.children[1]);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe6f7);
  const camera = new THREE.PerspectiveCamera(45, 1, 1, 2000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .47; controls.minDistance = 12; controls.maxDistance = 520;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 2.1); sun.position.set(-80, 140, 60); scene.add(sun);

  const shapeFrom = poly => { const sh = new THREE.Shape(); poly.forEach(([x, y], i) => i ? sh.lineTo(X(x), -Zc(y)) : sh.moveTo(X(x), -Zc(y))); sh.closePath(); return sh; };
  const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
  function extrude(poly, h, color, y0 = 0, o = {}) {
    const g = new THREE.ExtrudeGeometry(shapeFrom(poly), { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat(color, o)); m.position.y = y0; return m;
  }
  const edges = m => m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .25 })));
  function seg(a, b, wd, h, y, color, parent, o = {}) {
    const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, wd), mat(color, o));
    m.position.set((a.x + b.x) / 2, y, (a.z + b.z) / 2); m.rotation.y = -Math.atan2(dz, dx); parent.add(m);
    const j = new THREE.Mesh(new THREE.CylinderGeometry(wd / 2, wd / 2, h, 14), mat(color, o)); j.position.set(b.x, y, b.z); parent.add(j);
  }
  const V = ([x, y], h = 0) => new THREE.Vector3(X(x), h, Zc(y));

  // ground
  const land = new THREE.Mesh(new THREE.PlaneGeometry(900, 700), mat(0xe9e6df)); land.rotation.x = -Math.PI / 2; land.position.y = -.6; scene.add(land);
  scene.add(extrude(CAMPUS, .5, 0xd9d9db, -.5));
  GREENS.forEach(g => scene.add(extrude(g, .12, 0x99bd62)));
  ROADS.forEach(r => { const p = r.p.map(q => V(q, 0)); const n = r.closed ? p.length : p.length - 1; for (let i = 0; i < n; i++) seg(p[i], p[(i + 1) % p.length], r.w * S, .1, .05, 0x86868c, scene); });

  // tags
  const tags = [];
  function tag(obj, x, y, h, cls = '') {
    const el = document.createElement('div'); el.className = 'tag3d ' + cls; el.textContent = L(obj);
    const o = new CSS2DObject(el); o.position.set(X(x), h, Zc(y)); scene.add(o); tags.push({ el, obj }); return o;
  }
  BUILDINGS.forEach(b => {
    const m = extrude(b.poly, b.h, b.c3 || b.c); edges(m); scene.add(m);
    if (b.s3 && b.en) tag({ en: b.en.replace(/\n/g, ' '), hi: b.hi.replace(/\n/g, ' ') }, b.lx, b.ly, b.h + 2, 'sm');
  });

  // pandal
  const pc = new THREE.Group(); pc.position.set(X(PANDAL_C[0]), .1, Zc(PANDAL_C[1])); pc.rotation.y = -PANDAL_ANG; scene.add(pc);
  const PL = 78, PW = 22;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(PL, .15, PW + 3), mat(0xfde68a)); floor.position.y = .08; pc.add(floor);
  const stage = new THREE.Mesh(new THREE.BoxGeometry(6, 1.6, 18), mat(0x7c2d12)); stage.position.set(-PL / 2 + 3.5, .9, 0); pc.add(stage);
  const back = new THREE.Mesh(new THREE.BoxGeometry(.6, 6, 18), mat(0x991b1b)); back.position.set(-PL / 2 + .8, 3.1, 0); pc.add(back);
  const carpet = new THREE.Mesh(new THREE.BoxGeometry(PL - 8, .08, 1.6), mat(0xdc2626)); carpet.position.set(2, .2, 0); pc.add(carpet);
  const seatG = new THREE.BoxGeometry(.7, .9, .7);
  function seats(x0, x1, color) {
    const list = []; for (let x = x0; x <= x1; x += 1.15) for (let z = -10; z <= 10; z += 1.15) if (Math.abs(z) > 1.2) list.push([x, z]);
    const im = new THREE.InstancedMesh(seatG, mat(color), list.length), d = new THREE.Object3D();
    list.forEach(([x, z], i) => { d.position.set(x, .6, z); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }); pc.add(im);
  }
  seats(-PL / 2 + 9, -PL / 2 + 19, 0xeab308); seats(-PL / 2 + 22, PL / 2 - 4, 0x3b82f6);
  const roof = extrude(ZONES.pandal, .25, 0xfff3cf, 7.2, { transparent: true, opacity: .32 }); scene.add(roof);
  ZONES.pandal.concat([[1010, 368], [1000, 594], [820, 340], [820, 570], [1200, 398], [1200, 620]]).forEach(([x, y]) => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, 7.3, 8), mat(0xffffff)); p.position.set(X(x), 3.7, Zc(y)); scene.add(p);
  });
  tag(T.stage, PANDAL_C[0] - 340, PANDAL_C[1] - 55, 8, 'sm');
  tag({ en: 'PANDAL · CEREMONY', hi: 'पंडाल · समारोह' }, 1010, 500, 9.5, 'zp');
  // entry arch
  { const [ex, ey] = N.PIN, a = new THREE.Group(); a.position.set(X(ex), 0, Zc(ey)); a.rotation.y = -PANDAL_ANG; scene.add(a);
    [-2.6, 2.6].forEach(dx => { const c = new THREE.Mesh(new THREE.BoxGeometry(.9, 6, .9), mat(0xf59e0b)); c.position.set(dx, 3, 0); a.add(c); });
    const bm = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.1, 1), mat(0xf59e0b)); bm.position.set(0, 6.3, 0); a.add(bm);
    tag(T.entry, ex, ey, 8.4, 'zp'); }

  // lunch zones
  function lunch(zk, cx, cy, angRad, Lpx, rows, color, tagCls, tagTxt, off = 0) {
    scene.add(extrude(ZONES[zk], .22, color, .1, { transparent: true, opacity: .75 }));
    const g = new THREE.Group(); g.position.set(X(cx), .3, Zc(cy)); g.rotation.y = -angRad; scene.add(g);
    const n = Math.floor(Lpx * S / 4.2), tg = new THREE.CylinderGeometry(1, 1, .9, 16), top = new THREE.CylinderGeometry(1.3, 1.3, .12, 16);
    for (let i = 0; i < n; i++) for (let r = 0; r < rows; r++) {
      const px = (i - (n - 1) / 2) * 4.2, pz = (r - (rows - 1) / 2) * 3.6;
      const a = new THREE.Mesh(tg, mat(0xffffff)); a.position.set(px, .5, pz); g.add(a);
      const b = new THREE.Mesh(top, mat(0xf8fafc)); b.position.set(px, 1, pz); g.add(b);
    }
    tag(tagTxt, cx, cy, 5, tagCls);
  }
  lunch('lunchF', 985, 643, Math.atan2(98, 808), 760, 1, 0xef4444, 'zf', { en: 'STAFF LUNCH', hi: 'स्टाफ भोजन' });
  lunch('lunchS', 1935, 987, Math.atan2(-87, 295), 300, 2, 0x14b8a6, 'zs', { en: 'STUDENT LUNCH', hi: 'छात्र भोजन' });
  tag({ en: 'PHOTOGRAPHY · CR 1–10', hi: 'फोटोग्राफी · CR 1–10' }, 1705, 520, 7, 'zc');
  tag({ en: 'ROOM 308', hi: 'कमरा 308' }, 1248, 308, 13, 'sm');

  // gates
  Object.entries(GATES).forEach(([k, g]) => {
    const [x, y] = N[g.node], col = g.type === 'student' ? 0x16a34a : 0x2563eb;
    [-2.4, 2.4].forEach(dz => { const c = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 1), mat(col)); c.position.set(X(x), 3, Zc(y) + dz); scene.add(c); });
    const bm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 6.2), mat(col)); bm.position.set(X(x), 6.3, Zc(y)); scene.add(bm);
    const t = tag({ en: g.name.en, hi: g.name.hi }, x, y, 9, g.type === 'student' ? 'g1' : 'g2');
  });

  // route
  let rg = null, walker = null, rpts = [], cum = [], total = 0, wt = 0, flying = false, goal = null;
  function setRoute(r) {
    if (rg) { scene.remove(rg); rg = null; walker = null; }
    flying = false; if (!r) { return; }
    rg = new THREE.Group(); scene.add(rg);
    rpts = r.pts.map(p => V(p, .5)); cum = [0]; for (let i = 1; i < rpts.length; i++) cum.push(cum[i - 1] + rpts[i].distanceTo(rpts[i - 1])); total = cum[cum.length - 1];
    for (let i = 0; i < rpts.length - 1; i++) seg(rpts[i], rpts[i + 1], 2.2, .1, .28, 0xffffff, rg);
    for (let i = 0; i < rpts.length - 1; i++) seg(rpts[i], rpts[i + 1], 1.2, .12, .34, 0xe11d48, rg);
    const startRing = new THREE.Mesh(new THREE.TorusGeometry(2, .35, 8, 28), new THREE.MeshBasicMaterial({ color: 0x2563eb })); startRing.rotation.x = Math.PI / 2; startRing.position.copy(rpts[0]).setY(.5); rg.add(startRing);
    const end = rpts[rpts.length - 1], pin = new THREE.Group(); pin.position.copy(end);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8, 5, 16), new THREE.MeshBasicMaterial({ color: 0xe11d48 })); cone.rotation.x = Math.PI; cone.position.y = 2.6; pin.add(cone);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(2, 20, 16), new THREE.MeshBasicMaterial({ color: 0xe11d48 })); ball.position.y = 6.2; pin.add(ball);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.8, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); dot.position.y = 6.2; dot.position.z = 1.6; pin.add(dot);
    rg.add(pin);
    walker = new THREE.Mesh(new THREE.SphereGeometry(1.3, 18, 14), new THREE.MeshBasicMaterial({ color: 0x2563eb })); rg.add(walker); wt = 0;
    const bb = new THREE.Box3().setFromPoints(rpts), sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
    flyTo(c, Math.max(sz.x, sz.z) + 40, 1.05);
  }
  function posAt(d) { let i = 1; while (i < cum.length - 1 && cum[i] < d) i++; const t = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]); return rpts[i - 1].clone().lerp(rpts[i], Math.min(1, Math.max(0, t))); }
  function flyTo(target, extent, mul = 1) {
    const asp = camera.aspect || 1.5, d = Math.min(520, Math.max(extent / (.828 * Math.min(asp, 1.3)), 45) * mul);
    goal = { t: target.clone().setY(0), p: target.clone().setY(0).add(new THREE.Vector3(0, .82, .57).multiplyScalar(d)) };
  }
  const home = () => flyTo(new THREE.Vector3(0, 0, 3), 285, .92);
  view3d.home = home;

  function resize() { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h); lr.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', () => view3d.active && resize());
  let active = false; const clock = new THREE.Clock();
  function loop() {
    if (!active) return; requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), .05);
    if (walker && total) {
      wt = (wt + dt * (flying ? 20 : 26) / total) % 1; const p = posAt(wt * total); walker.position.copy(p).setY(1.6);
      if (flying) { const off = camera.position.clone().sub(controls.target); controls.target.lerp(p.clone().setY(0), .12); camera.position.copy(controls.target).add(off); }
    }
    if (goal && !flying) {
      controls.target.lerp(goal.t, .09); camera.position.lerp(goal.p, .09);
      if (controls.target.distanceTo(goal.t) < .3 && camera.position.distanceTo(goal.p) < .6) goal = null;
    }
    controls.update(); renderer.render(scene, camera); lr.render(scene, camera);
  }
  controls.addEventListener('start', () => { goal = null; });
  Object.assign(view3d, {
    ready: true, active: false, setRoute,
    show(on) { active = on; view3d.active = on; if (on) { resize(); if (!view3d.placed) { view3d.placed = true; const t = new THREE.Vector3(0, 0, 3); camera.position.set(0, 130, 95); controls.target.copy(t); home(); } clock.getDelta(); loop(); } },
    fly(on) { flying = on; goal = null; if (on && walker) { const p = walker.position; controls.target.copy(p).setY(0); camera.position.copy(p).add(new THREE.Vector3(-14, 17, 15)); } },
    relabel() { tags.forEach(t => t.el.textContent = L(t.obj)); },
  });
}

/* ============================================================
   START
   ============================================================ */
buildBase(); renderLabels(); applyI18n(); computeRoute(); drawDyn(); renderPanel();
requestAnimationFrame(() => fit2d());
window.addEventListener('resize', () => { if (state.mode === '2d' && !view.touched) fitToContext(); });
new ResizeObserver(() => { if (state.mode === '2d' && !view.touched) fitToContext(); }).observe($('#stage'));
</script>
</body>
