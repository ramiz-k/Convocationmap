<style>
:root{--bg:#f3f6fb;--ink:#14233b;--muted:#5d6b82;--card:#fff;--line:#dbe4f0;--brand:#084c9d;--brand-d:#063a78;--soft:#e8f0fb;--route:#e11d48;--green:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
button{font-family:inherit}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:#fff;flex-wrap:wrap}
header .ttl{flex:1;min-width:160px}
header h1{font-size:17px;margin:0;line-height:1.25}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
.seg{display:inline-flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--brand)}
#layout{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#e6ecf4;overflow:hidden}
#panel{background:var(--card);border-top:1px solid var(--line);max-height:48%;overflow:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
@media(max-width:600px){header{padding:8px 12px;flex-wrap:nowrap;gap:8px}header p{display:none}header h1{font-size:14px}.seg button{padding:6px 10px;font-size:13px}}
@media(min-width:900px){#layout{flex-direction:row-reverse}#panel{width:410px;max-height:none;border-top:0;border-right:1px solid var(--line)}}
#map2d,#map3d{position:absolute;inset:0}
#map2d{display:none}
#map3d canvas{display:block;width:100%;height:100%}
.lab3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
svg#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.lbl{font-weight:700;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(8,40,90,.55);stroke-width:7px;stroke-linejoin:round;pointer-events:none}
.lbl.dark{fill:#14233b;stroke:rgba(255,255,255,.9)}
.tag{font-weight:700;fill:#14233b;paint-order:stroke;stroke:#fff;stroke-width:13px;stroke-linejoin:round;pointer-events:none}
.gate,.zone,.fac2{cursor:pointer}
.rcase{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.rbase{fill:none;stroke:#e11d48;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}
.rdash{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 32;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-35}}
.pulse{fill:rgba(0,150,255,.4);transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.6);opacity:0}}
.ctrls{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.ctrls button{width:44px;height:44px;border-radius:14px;border:0;background:#fff;font-size:22px;font-weight:700;color:var(--brand);box-shadow:0 2px 8px rgba(8,40,90,.25);cursor:pointer}
.ctrls button.wide{font-size:14px;width:auto;padding:0 14px;background:var(--brand);color:#fff}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#14233b;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;display:none;z-index:9;text-align:center;max-width:90%}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(243,246,251,.92);z-index:8;font-weight:700;color:var(--brand);font-size:16px}
.tag3d{font:700 12px/1.2 Inter,'Noto Sans Devanagari',system-ui,sans-serif;color:#14233b;background:rgba(255,255,255,.94);padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;transform:translateY(-6px)}
.tag3d.g1{background:#16a34a;color:#fff}.tag3d.g2{background:#084c9d;color:#fff}
.tag3d.zp{background:#f5b301;color:#3b2a00;font-size:13px}.tag3d.zf{background:#ea580c;color:#fff}.tag3d.zs{background:#0d9488;color:#fff}.tag3d.zc{background:#7c3aed;color:#fff}
.tag3d.wc{background:#084c9d;color:#fff}.tag3d.hc{background:#dc2626;color:#fff}.tag3d.cafe{background:#7c4a21;color:#fff}
.tag3d.sm{font-size:10.5px;font-weight:600;opacity:.92}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:18px 0 10px}
.step:first-child{margin-top:0}
.step i{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px;min-height:64px;text-align:left;cursor:pointer;color:var(--ink)}
.dest .ic{font-size:24px}
.dest b{display:block;font-size:14px;line-height:1.25}
.dest small{color:var(--muted);font-size:12px}
.dest.on{border-color:var(--brand);background:var(--soft);box-shadow:0 0 0 3px rgba(8,76,157,.15)}
.dest:disabled{opacity:.4;cursor:not-allowed}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fac{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;min-height:48px;font-size:14px;font-weight:700;cursor:pointer;color:var(--brand)}
.fac.on{border-color:var(--brand);background:var(--soft)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.result{margin-top:18px;border:1.5px solid var(--brand);border-radius:18px;padding:14px;background:var(--soft)}
.meta{font-weight:700;font-size:16px;color:var(--brand-d)}
ol.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 36px;font-size:15px;line-height:1.45}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps li:not(:last-child):after{content:"";position:absolute;left:12px;top:26px;bottom:1px;width:2px;background:#b7cbe6}
ol.steps li.last:before{background:var(--route)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;min-height:46px}
.btn.pri{background:var(--brand);color:#fff}.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
details{margin-top:18px}
summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
</style>

  const dist = { [a]: 0 }, prev = {}, done = new Set(), q = [[0, a]];
  while (q.length) {
    q.sort((x, y) => x[0] - y[0]);
    const [d, u] = q.shift();
    if (done.has(u)) continue; done.add(u); if (u === b) break;
    for (const [v, w] of ADJ[u] || []) if (dist[v] === undefined || d + w < dist[v]) { dist[v] = d + w; prev[v] = u; q.push([dist[v], v]); }
  }
  if (dist[b] === undefined) return null;
  const path = [b]; while (path[0] !== a) path.unshift(prev[path[0]]);
  return { nodes: path, len: dist[b] };
}

function nearestWC() {
  const a = nodeIdOfKey(state.from); let best = null;
  Object.keys(WCS).forEach(k => { const r = shortest(a, PLACES[k].node); if (r && (!best || r.len < best.len)) best = { k, len: r.len }; });
  return best && best.k;

function computeRoute() {
  route = null;
  if (!state.from || !state.to || state.from === state.to) return;
  const r = shortest(nodeIdOfKey(state.from), nodeIdOfKey(state.to));
  if (!r) return;
  const steps = [];
  r.nodes.forEach((id, i) => {
    if (i === 0 && !isGateNode(id)) return;
    const s = SAY[id + '>' + r.nodes[i + 1]] || SAY[id];
    if (s) steps.push(s);
  });
  steps.push(arriveFor(state.to));
  const rp = [N[r.nodes[0]]];
  for (let i = 1; i < r.nodes.length; i++) geomOf(r.nodes[i - 1], r.nodes[i]).slice(1).forEach(p => rp.push(p));
  route = { nodes: r.nodes, pts: rp, len: r.len, steps };
}

const svg = $('#svg'), world = $('#world');
const view = { k: 1, x: 0, y: 0, touched: false };
const setT = () => world.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
function fit2d(bbox, pad = 80) {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const b = bbox || [0, 0, W, H];
  const bw = b[2] - b[0] + pad * 2, bh = b[3] - b[1] + pad * 2;
  view.k = Math.min(r.width / bw, r.height / bh);
  view.x = r.width / 2 - ((b[0] + b[2]) / 2) * view.k;
  view.y = r.height / 2 - ((b[1] + b[3]) / 2) * view.k;
  setT();
}
function zoomAt(f, cx, cy) {
  const k2 = Math.max(.08, Math.min(view.k * f, 2.2));
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = k2; view.x = cx - wx * k2; view.y = cy - wy * k2; view.touched = true; setT();
}
(function pointers() {
  const ptrs = new Map(); let moved = 0;
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const old = ptrs.get(e.pointerId), r = svg.getBoundingClientRect();
    if (ptrs.size === 1) {
      const dx = e.clientX - old[0], dy = e.clientY - old[1];
      moved += Math.abs(dx) + Math.abs(dy); view.x += dx; view.y += dy; view.touched = true; setT();
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(old[0] - other[0], old[1] - other[1]);
      const d1 = Math.hypot(e.clientX - other[0], e.clientY - other[1]);
      moved += 10;
      if (d0 > 0) zoomAt(d1 / d0, (e.clientX + other[0]) / 2 - r.left, (e.clientY + other[1]) / 2 - r.top);
    }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  });
  const up = e => {
    const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId);
    if (wasOne && moved < 8 && e.type === 'pointerup') onMapTap(e);
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
})();

let switching = false;
async function setMode(m) {
  if (switching) return; switching = true;
  if (m === '3d' && !view3d.ready) {
    $('#loading').style.display = 'flex';
    try { await init3D(); } catch (err) { console.error(err); toast(L(T.err3d)); m = '2d'; }
    $('#loading').style.display = 'none';
  }
  state.mode = m; state.fly = false; view3d.fly && view3d.fly(false);
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#map2d').style.display = m === '2d' ? 'block' : 'none';
  $('#map3d').style.display = m === '3d' ? 'block' : 'none';
  if (m === '3d') { view3d.show(true); view3d.setRoute(route); } else { view3d.ready && view3d.show(false); if (!view.touched) fitToContext(); }
  applyI18n(); $('#fly').style.display = m === '3d' && route ? '' : 'none';
  switching = false;
}
function update() {
  computeRoute(); drawDyn(); renderPanel();
  view.touched = false; if (state.mode === '2d') fitToContext();
  if (view3d.ready) view3d.setRoute(route);
  $('#fly').style.display = state.mode === '3d' && route ? '' : 'none'; applyI18n();
}
$('#fly').onclick = () => { state.fly = !state.fly; view3d.fly && view3d.fly(state.fly); applyI18n(); };

  const renderer = new THREE.WebGLRenderer({ antialias: true });

  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdbe9f8);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.7));

  }
  const V = ([x, y], h = 0) => new THREE.Vector3(X(x), h, Zc(y));

  // ground, greens, roads
  const land = new THREE.Mesh(new THREE.PlaneGeometry(900, 700), mat(0xe3e9f1)); land.rotation.x = -Math.PI / 2; land.position.y = -.6; scene.add(land);
  scene.add(extrude(CAMPUS, .5, 0xeef1f5, -.5));
  GREENS.forEach(g => scene.add(extrude(g, .12, 0xb3d99a)));
  ROADS.forEach(sh => {
    const v2 = ring => ring.map(([x, y]) => new THREE.Vector2(X(x), -Zc(y)));
    const shp = new THREE.Shape(v2(sh.o)); sh.h.forEach(h => shp.holes.push(new THREE.Path(v2(h))));
    const geo = new THREE.ExtrudeGeometry(shp, { depth: .16, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);

  });
  tag(T.stage, PANDAL_C[0] - 340, PANDAL_C[1] - 55, 8, 'sm');

  // entry arch next to Nescafe
  { const [ex, ey] = N.PIN, a = new THREE.Group(); a.position.set(X(ex), 0, Zc(ey)); a.rotation.y = -PANDAL_ANG; scene.add(a);

    tag(tagTxt, cx, cy, 5, tagCls);

  lunch('lunchF', 990, 632, Math.atan2(94, 793), 760, 1, 0xea580c, 'zf', { en: 'STAFF LUNCH', hi: 'स्टाफ भोजन' });
  lunch('lunchS', 1935, 987, Math.atan2(-87, 295), 300, 2, 0x0d9488, 'zs', { en: 'STUDENT LUNCH', hi: 'छात्र भोजन' });

  // photography areas (purple slabs on the roofs)
  scene.add(extrude(ZONES.photoA, .3, 0x7c3aed, 4, { transparent: true, opacity: .85 }));
  tag({ en: 'PHOTO AREA 1 · CR 1–10', hi: 'फोटो क्षेत्र 1 · CR 1–10' }, 1705, 520, 7, 'zc');
  ZONES.photoB.forEach(p => scene.add(extrude(p, .3, 0x7c3aed, 6, { transparent: true, opacity: .9 })));
  tag({ en: 'PHOTO AREA 2 · NL2 · CR 12 · HALL 69', hi: 'फोटो क्षेत्र 2 · NL2 · CR 12 · हॉल 69' }, 2010, 392, 9, 'zc');
  tag({ en: 'ROOM 308', hi: 'कमरा 308' }, 1248, 308, 13, 'sm');

  // health centre
  { const [hx, hy] = N.HC; box(5, 4.5, 5, 0xffffff, X(hx), 2.25, Zc(hy)); box(3.2, .3, .9, 0xdc2626, X(hx), 4.65, Zc(hy)); box(.9, .3, 3.2, 0xdc2626, X(hx), 4.65, Zc(hy)); tag(T.hcL, hx, hy, 7, 'hc'); }
  // washrooms
  Object.entries(WCS).forEach(([k, [x, y]]) => { box(2.8, 2.8, 2.8, 0x084c9d, X(x), 1.4, Zc(y)); tag(WCNAME, x, y, 4.4, 'wc sm'); });

  // gates
  Object.entries(GATES).forEach(([k, g]) => {
    const [x, y] = N[g.node], col = 0x084c9d;
    [-2.4, 2.4].forEach(dz => box(1, 6, 1, col, X(x), 3, Zc(y) + dz));
    box(1.2, 1.1, 6.2, col, X(x), 6.3, Zc(y));
    tag(g.title, x, y, 9, 'g2');
  });

  // route
  let rg = null, walker = null, rpts = [], cum = [], total = 0, wt = 0, flying = false, goal = null;
  function setRoute(r) {
    if (rg) { scene.remove(rg); rg = null; walker = null; }
    flying = false; if (!r) return;
    rg = new THREE.Group(); scene.add(rg);
    rpts = r.pts.map(p => V(p, .5)); cum = [0]; for (let i = 1; i < rpts.length; i++) cum.push(cum[i - 1] + rpts[i].distanceTo(rpts[i - 1])); total = cum[cum.length - 1];
    for (let i = 0; i < rpts.length - 1; i++) seg(rpts[i], rpts[i + 1], 2.4, .1, .3, 0xffffff, rg);
    for (let i = 0; i < rpts.length - 1; i++) seg(rpts[i], rpts[i + 1], 1.3, .12, .36, 0xe11d48, rg);
    const startRing = new THREE.Mesh(new THREE.TorusGeometry(2, .35, 8, 28), new THREE.MeshBasicMaterial({ color: 0x0096ff })); startRing.rotation.x = Math.PI / 2; startRing.position.copy(rpts[0]).setY(.5); rg.add(startRing);
    const end = rpts[rpts.length - 1], pin = new THREE.Group(); pin.position.copy(end);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8, 5, 16), new THREE.MeshBasicMaterial({ color: 0xe11d48 })); cone.rotation.x = Math.PI; cone.position.y = 2.6; pin.add(cone);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(2, 20, 16), new THREE.MeshBasicMaterial({ color: 0xe11d48 })); ball.position.y = 6.2; pin.add(ball);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.8, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); dot.position.y = 6.2; dot.position.z = 1.6; pin.add(dot);
    rg.add(pin);
    walker = new THREE.Mesh(new THREE.SphereGeometry(1.3, 18, 14), new THREE.MeshBasicMaterial({ color: 0x0096ff })); rg.add(walker); wt = 0;
    const bb = new THREE.Box3().setFromPoints(rpts), sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
    flyTo(c, Math.max(sz.x, sz.z) + 40, 1.05);
  }
  function posAt(d) { let i = 1; while (i < cum.length - 1 && cum[i] < d) i++; const t = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]); return rpts[i - 1].clone().lerp(rpts[i], Math.min(1, Math.max(0, t))); }
  function flyTo(target, extent, mul = 1) {
    const asp = camera.aspect || 1.5, d = Math.min(520, Math.max(extent / (.828 * Math.min(asp, 1.3)), 45) * mul);
    goal = { t: target.clone().setY(0), p: target.clone().setY(0).add(new THREE.Vector3(0, .82, .57).multiplyScalar(d)) };
  }
  const home = () => flyTo(new THREE.Vector3(0, 0, 3), 285, .92);
  view3d.home = home;

  function resize() { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h); lr.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  new ResizeObserver(() => view3d.active && resize()).observe(host);
  let active = false; const clock = new THREE.Clock();
  function loop() {
    if (!active) return; requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), .05);
    if (walker && total) {
      wt = (wt + dt * (flying ? 20 : 26) / total) % 1; const p = posAt(wt * total); walker.position.copy(p).setY(1.6);
      if (flying) { const off = camera.position.clone().sub(controls.target); controls.target.lerp(p.clone().setY(0), .12); camera.position.copy(controls.target).add(off); }
    }
    if (goal && !flying) {
      controls.target.lerp(goal.t, .09); camera.position.lerp(goal.p, .09);
      if (controls.target.distanceTo(goal.t) < .3 && camera.position.distanceTo(goal.p) < .6) goal = null;
    }
    controls.update(); renderer.render(scene, camera); lr.render(scene, camera);
  }
  controls.addEventListener('start', () => { goal = null; });
  Object.assign(view3d, {
    ready: true, active: false, setRoute,
    show(on) { active = on; view3d.active = on; if (on) { resize(); if (!view3d.placed) { view3d.placed = true; const t = new THREE.Vector3(0, 0, 3); camera.position.set(0, 130, 95); controls.target.copy(t); home(); } clock.getDelta(); loop(); } },
    fly(on) { flying = on; goal = null; if (on && walker) { const p = walker.position; controls.target.copy(p).setY(0); camera.position.copy(p).add(new THREE.Vector3(-14, 17, 15)); } },
    relabel() { tags.forEach(t => t.el.textContent = L(t.obj)); },
  });
}
